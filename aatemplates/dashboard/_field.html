{% if field.field.widget.input_type == "checkbox" %}<label class="c">{{ field }} {{ field.label }}{% if field.errors %}<small class="err">{{ field.errors|join:" " }}</small>{% endif %}</label>
{% else %}<label>{{ field.label }}{{ field }}{% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}{% if field.errors %}<small class="err">{{ field.errors|join:" " }}</small>{% endif %}</label>{% endif %}
