{% extends "dashboard/base.html" %}
{% block title %}Change password{% endblock %}{% block crumb %}Change password{% endblock %}
{% block content %}<div class="ph"><div><h1>Change password</h1></div></div>
<form class="card" method="post" style="max-width:520px">{% csrf_token %}<div class="f wide">
{% for field in form %}<label>{{ field.label }}{{ field }}{% for e in field.errors %}<small class="err">{{ e }}</small>{% endfor %}</label>{% endfor %}
<button class="btn p" type="submit">Update password</button></div></form>{% endblock %}
