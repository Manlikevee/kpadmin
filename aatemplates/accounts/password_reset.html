{% extends "accounts/_auth_base.html" %}
{% block title %}Reset password{% endblock %}
{% block box %}<h1>Reset your password</h1><div class="sub">Enter your email and we’ll send you a reset link.</div>
<form class="f" method="post">{% csrf_token %}<label>Email{{ form.email }}{% for e in form.email.errors %}<small class="err">{{ e }}</small>{% endfor %}</label><button class="btn p big" type="submit">Send reset link</button></form>{% endblock %}
